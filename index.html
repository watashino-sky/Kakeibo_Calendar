<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>家計簿</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0ebe0;--bg2:#e8e2d8;--bg3:#faf7f2;
  --card:#ffffff;--bdr:#dfd8cc;
  --text:#2a2016;--dim:#9a8d7c;--hi:#1a1408;
  --acc:#b8895a;--acc2:#9a7040;
  --red:#c05a5a;--grn:#5a9870;--tag:#ede7dc;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Meiryo",sans-serif;font-size:14px}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto}

.sc{display:none;flex:1;flex-direction:column;min-height:100vh;padding-bottom:68px}
.sc.on{display:flex}

/* top bar */
.bar{display:flex;align-items:center;padding:14px 16px 10px;gap:8px;background:var(--bg);border-bottom:1px solid var(--bdr)}
.bar-t{flex:1;font-size:17px;font-weight:600;color:var(--hi);letter-spacing:.01em}
.bar-bk{background:none;border:none;color:var(--dim);font-size:24px;cursor:pointer;line-height:1;padding:0 6px 2px;border-radius:6px;font-family:inherit}
.bar-bk:active{background:var(--bg3)}

/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:62px;background:var(--bg2);border-top:1px solid var(--bdr);display:flex;z-index:50}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--dim);font-size:9px;letter-spacing:.05em;cursor:pointer;padding:6px 0;transition:color .15s;font-family:inherit}
.nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nb.on{color:var(--acc)}

/* month header */
.mon-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;background:var(--bg)}
.mon-name{font-size:22px;font-weight:700;color:var(--hi);letter-spacing:-.02em}
.mon-yr{font-size:14px;color:var(--dim);margin-left:6px}
.mon-btns{display:flex;gap:6px}
.mon-btn{width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--bdr);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.mon-btn:active{background:var(--bdr)}

/* summary band */
.band{background:var(--bg);border-bottom:1px solid var(--bdr);padding:14px 18px}
.band-lbl{font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.band-num{font-family:"DM Mono",monospace;font-size:36px;font-weight:500;color:var(--acc);letter-spacing:-.02em;line-height:1}
.band-num span{font-size:15px;color:var(--dim);margin-left:4px;font-weight:400}

/* mode toggle */
.toggle{display:flex;background:var(--bg3);border:1px solid var(--bdr);border-radius:10px;overflow:hidden;margin:10px 12px}
.tgl{flex:1;padding:9px;text-align:center;font-size:11px;letter-spacing:.06em;color:var(--dim);cursor:pointer;border:none;background:none;font-family:inherit;transition:all .15s}
.tgl.on{background:var(--acc);color:#fff;font-weight:700}

/* calendar */
.cal-wrap{padding:4px 10px 10px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.dow div{text-align:center;font-size:9px;color:var(--dim);padding:5px 0;letter-spacing:.05em}
.dow div:first-child{color:var(--red)}
.dow div:last-child{color:#7090b8}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cc{min-height:50px;border-radius:8px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.07);display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;cursor:pointer;border:1.5px solid transparent;transition:border-color .1s,background .1s}
.cc:active{opacity:.7}
.cc.emp{background:transparent;box-shadow:none;border-color:transparent;pointer-events:none}
.cc.today{background:var(--acc);border-color:var(--acc)}
.cc.today .cday{color:#fff}
.cc.today .camt{color:rgba(255,255,255,.85)}
.cc.sun .cday{color:var(--red)}
.cc.sat .cday{color:#7090b8}
.cc.today.sun .cday,.cc.today.sat .cday{color:#fff}
.cday{font-size:12px;font-weight:500;color:var(--text);line-height:1}
.camt{font-family:"DM Mono",monospace;font-size:7px;color:var(--acc);margin-top:3px;line-height:1.1;text-align:center;max-width:36px;overflow:hidden;white-space:nowrap}
.cdot{width:4px;height:4px;border-radius:50%;margin-top:3px}
.cdot.r{background:var(--red)}
.cdot.g{background:var(--grn)}

/* section label */
.sl{font-size:10px;color:var(--dim);letter-spacing:.07em;text-transform:uppercase;padding:14px 16px 6px}

/* day header */
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bdr)}
.dh-date{font-size:16px;font-weight:600;color:var(--hi)}
.dh-tot{font-family:"DM Mono",monospace;font-size:22px;color:var(--acc);font-weight:500}
.dh-tot span{font-size:12px;color:var(--dim);margin-left:2px}

/* trip card */
.tc{background:var(--card);border-radius:10px;border:1px solid var(--bdr);margin:0 12px 8px;overflow:hidden}
.tc-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.tc-shop{font-size:14px;font-weight:600;color:var(--hi)}
.tc-tot{font-family:"DM Mono",monospace;font-size:14px;color:var(--acc)}
.tc-items{border-top:1px solid var(--bdr);padding:6px 14px}
.ti{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bdr)}
.ti:last-child{border:none}
.ti-p{font-family:"DM Mono",monospace;font-size:13px;color:var(--text);min-width:58px}
.ti-tgs{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--tag);color:var(--dim);font-size:10px;padding:2px 7px;border-radius:4px}

/* coupon alert */
.c-alert{background:rgba(184,137,90,.1);border-left:3px solid var(--acc);padding:7px 10px;font-size:12px;color:var(--acc);margin:0 14px 6px;border-radius:0 6px 6px 0}

/* empty */
.empty{text-align:center;padding:48px 20px;color:var(--dim);font-size:13px;line-height:2}
.empty svg{width:32px;height:32px;stroke:var(--bdr);fill:none;stroke-width:1.2;display:block;margin:0 auto 12px}

/* form */
.fw{padding:12px 12px 0}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:10px;color:var(--dim);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg3);border:1.5px solid var(--bdr);border-radius:8px;color:var(--hi);font-size:15px;padding:10px 12px;outline:none;font-family:inherit;-webkit-appearance:none;appearance:none}
.fld textarea{resize:none;min-height:84px;line-height:1.6}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc)}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer}

/* tag selector */
.tgsel{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px 12px}
.tg{background:var(--bg3);border:1.5px solid var(--bdr);color:var(--dim);font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;user-select:none}
.tg.on{background:rgba(184,137,90,.15);border-color:var(--acc2);color:var(--acc)}

/* item rows */
.it-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:9px 12px;margin:0 12px 6px}
.it-p{font-family:"DM Mono",monospace;font-size:14px;color:var(--acc)}
.it-t{font-size:11px;color:var(--dim);margin-top:2px}
.it-del{background:none;border:none;color:var(--red);font-size:20px;cursor:pointer;padding:0 4px;line-height:1}

/* add row */
.add-row{display:flex;align-items:center;gap:10px;padding:12px 16px;color:var(--acc);font-size:14px;cursor:pointer;border-top:1px solid var(--bdr)}
.add-row svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.add-row:active{opacity:.7}

/* buttons */
.brow{display:flex;gap:8px;padding:12px}
.btn{flex:1;padding:13px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.02em}
.btn-p{background:var(--acc);color:#fff}
.btn-p:active{background:var(--acc2)}
.btn-g{background:var(--bg3);color:var(--dim);border:1px solid var(--bdr)}
.btn-g:active{background:var(--bdr)}
.btn-d{background:transparent;color:var(--red);border:1.5px solid var(--red)}

/* sub card */
.sub-c{background:var(--card);border-radius:10px;border:1px solid var(--bdr);margin:0 12px 8px;padding:12px 14px;cursor:pointer}
.sub-c:active{opacity:.8}
.sub-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.sub-nm{font-size:15px;font-weight:600;color:var(--hi)}
.sub-am{font-family:"DM Mono",monospace;font-size:16px;color:var(--acc)}
.sub-mt{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sub-bg{background:var(--tag);color:var(--dim);font-size:10px;padding:2px 7px;border-radius:4px}

/* coupon card */
.cpn-c{background:var(--card);border-radius:10px;border:1px solid var(--bdr);margin:0 12px 8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer}
.cpn-c:active{opacity:.8}
.cpn-sh{font-size:15px;font-weight:600;color:var(--hi);margin-bottom:3px}
.cpn-ex{font-size:12px;color:var(--dim)}
.cpn-memo{font-size:12px;color:var(--text);margin-top:5px;line-height:1.6;white-space:pre-wrap}
.use-btn{background:transparent;border:1.5px solid var(--red);color:var(--red);font-size:12px;padding:6px 14px;border-radius:8px;cursor:pointer;font-family:inherit;flex-shrink:0;margin-left:10px;margin-top:2px}
.use-btn:active{opacity:.7}

/* settings */
.set-card{background:var(--card);border-radius:10px;border:1px solid var(--bdr);margin:0 12px 10px;padding:12px 14px}

/* toast */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:9px 18px;font-size:12px;color:var(--hi);z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;font-family:"DM Mono",monospace;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--grn);color:var(--grn)}
.toast.err{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>

<!-- CALENDAR -->
<div id="s-cal" class="sc on">
  <div class="mon-hd">
    <div>
      <span class="mon-name" id="cal-mn"></span>
      <span class="mon-yr" id="cal-yr"></span>
    </div>
    <div class="mon-btns">
      <button class="mon-btn" onclick="shiftMon(-1)">&#8249;</button>
      <button class="mon-btn" onclick="shiftMon(1)">&#8250;</button>
    </div>
  </div>
  <div class="band">
    <div class="band-lbl">Monthly Total</div>
    <div class="band-num" id="cal-tot">&#8212;<span>円</span></div>
  </div>
  <div class="toggle">
    <button class="tgl on" id="tgl-a" onclick="setCalMode('amount')">AMOUNT</button>
    <button class="tgl" id="tgl-c" onclick="setCalMode('coupon')">COUPON</button>
  </div>
  <div class="cal-wrap">
    <div class="dow"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
    <div class="grid" id="cal-grid"></div>
  </div>
</div>

<!-- DAY DETAIL -->
<div id="s-day" class="sc">
  <div class="bar">
    <button class="bar-bk" onclick="go('cal')">&#8249;</button>
    <span class="bar-t" id="day-title"></span>
  </div>
  <div id="day-hd"></div>
  <div id="day-body"></div>
</div>

<!-- SHOP FORM -->
<div id="s-shop" class="sc">
  <div class="bar">
    <button class="bar-bk" onclick="go('day')">&#8249;</button>
    <span class="bar-t">買い物を追加</span>
  </div>
  <div class="fw">
    <div class="fld">
      <label>店名</label>
      <input id="shop-nm" list="shop-dl" placeholder="店を入力" autocomplete="off">
      <datalist id="shop-dl"></datalist>
    </div>
  </div>
  <div class="sl">商品</div>
  <div id="item-rows"></div>
  <div class="add-row" onclick="goItem()">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    商品を追加
  </div>
  <div class="brow">
    <button class="btn btn-g" onclick="go('day')">キャンセル</button>
    <button class="btn btn-p" onclick="saveShop()">保存</button>
  </div>
</div>

<!-- ITEM FORM -->
<div id="s-item" class="sc">
  <div class="bar">
    <button class="bar-bk" onclick="go('shop')">&#8249;</button>
    <span class="bar-t">商品を追加</span>
  </div>
  <div class="fw">
    <div class="fld">
      <label>金額（円）</label>
      <input id="item-pr" type="number" inputmode="numeric" placeholder="0">
    </div>
  </div>
  <div class="sl">カテゴリ</div>
  <div id="item-tgs" class="tgsel"></div>
  <div class="brow">
    <button class="btn btn-g" onclick="go('shop')">キャンセル</button>
    <button class="btn btn-p" onclick="addItem()">追加</button>
  </div>
</div>

<!-- SUB LIST -->
<div id="s-sub" class="sc">
  <div class="bar"><span class="bar-t">サブスク</span></div>
  <div id="sub-band" class="band" style="display:none">
    <div class="band-lbl">月額合計</div>
    <div class="band-num" id="sub-tot">&#8212;<span>円</span></div>
  </div>
  <div id="sub-body"></div>
  <div class="add-row" onclick="openSubForm(-1)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    サブスクを追加
  </div>
</div>

<!-- SUB FORM -->
<div id="s-sub-form" class="sc">
  <div class="bar">
    <button class="bar-bk" onclick="go('sub')">&#8249;</button>
    <span class="bar-t" id="sf-title">サブスクを追加</span>
  </div>
  <div class="fw">
    <div class="fld"><label>サービス名</label><input id="sf-nm" placeholder="Netflix、Spotify など"></div>
    <div class="fld"><label>金額（円）</label><input id="sf-am" type="number" inputmode="numeric" placeholder="0"></div>
    <div class="fld">
      <label>サイクル</label>
      <select id="sf-cy"><option value="monthly">月次</option><option value="yearly">年次</option></select>
    </div>
    <div class="fld"><label>次回請求日</label><input id="sf-nd" type="date"></div>
  </div>
  <div class="sl">カテゴリ</div>
  <div id="sf-tgs" class="tgsel"></div>
  <div id="sf-btns" class="brow"></div>
</div>

<!-- COUPON LIST -->
<div id="s-cpn" class="sc">
  <div class="bar"><span class="bar-t">クーポン</span></div>
  <div id="cpn-body"></div>
  <div class="add-row" onclick="openCpnForm(-1)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    クーポンを追加
  </div>
</div>

<!-- COUPON FORM -->
<div id="s-cpn-form" class="sc">
  <div class="bar">
    <button class="bar-bk" onclick="go('cpn')">&#8249;</button>
    <span class="bar-t" id="cf-title">クーポンを追加</span>
  </div>
  <div class="fw">
    <div class="fld"><label>店名</label><input id="cf-sh" list="shop-dl" placeholder="店名" autocomplete="off"></div>
    <div class="fld"><label>有効期限</label><input id="cf-ex" type="date"></div>
    <div class="fld"><label>備考</label><textarea id="cf-memo" placeholder="割引内容、条件、金額など"></textarea></div>
  </div>
  <div id="cf-btns" class="brow"></div>
</div>

<!-- SETTINGS -->
<div id="s-settings" class="sc">
  <div class="bar"><span class="bar-t">設定</span></div>
  <div class="sl">タグ</div>
  <div class="set-card">
    <div class="fld" style="margin:0"><label>カンマ区切り</label><input id="st-tg" placeholder="食費,日用品,交通費,..."></div>
  </div>
  <div class="sl">よく使う店</div>
  <div class="set-card">
    <div class="fld" style="margin:0"><label>カンマ区切り</label><input id="st-sh" placeholder="スーパー,コンビニ,..."></div>
  </div>
  <div class="brow">
    <button class="btn btn-p" style="flex:1" onclick="saveSettings()">保存</button>
  </div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nb on" id="nav-cal" onclick="go('cal')">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
    CALENDAR
  </button>
  <button class="nb" id="nav-sub" onclick="go('sub')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
    SUB
  </button>
  <button class="nb" id="nav-cpn" onclick="go('cpn')">
    <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="2"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="2"/></svg>
    COUPON
  </button>
  <button class="nb" id="nav-settings" onclick="go('settings')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    SETTINGS
  </button>
</nav>

<div id="toast" class="toast"></div>

<script>
const GAS='https://script.google.com/macros/s/AKfycbzdJY__eIbZ5GSvzkuGXsMHu8XiRk-RHZUlaD4qPrHng55Bwx8m94bBvrzL4O-CsEhx/exec';

// state
const TODAY=new Date();
const TODAY_STR=fmt(TODAY);
let records=[],coupons=[],subs=[],tags=['食費','日用品','交通費','娯楽','医療','その他'],shops=[];
let curMon=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
let calMode='amount';
let curDate=TODAY_STR;
let curItems=[],selIt=[];
let sfIdx=-1,sfTags=[];
let cfIdx=-1;
let nid=100;
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];

// ── date helpers ──
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return String(n).padStart(2,'0');}

// sd: ANY GAS date format → "YYYY-MM-DD"
function sd(v){
  if(!v)return'';
  if(v instanceof Date)return fmt(v);
  return String(v).replace(/\//g,'-').slice(0,10);
}

// advNextDate: 保存済みの nextDate を今日以降に繰り越す
function advNextDate(dateStr,cycle){
  var ds=sd(dateStr);
  if(!ds)return'';
  var d=new Date(ds+'T00:00:00');
  if(isNaN(d.getTime()))return ds;
  var today=new Date(TODAY_STR+'T00:00:00');
  while(d<today){
    if(cycle==='yearly')d.setFullYear(d.getFullYear()+1);
    else d.setMonth(d.getMonth()+1);
  }
  return fmt(d);
}

function jpDate(ds){
  if(!ds||ds.length<10)return ds||'';
  var p=ds.split('-');
  return p[0]+'年'+Number(p[1])+'月'+Number(p[2])+'日';
}

// ── items helpers ──
function gitems(r){
  try{
    if(Array.isArray(r.items))return r.items;
    if(typeof r.items==='string')return JSON.parse(r.items);
    return[];
  }catch(e){return[];}
}
function rtot(r){return gitems(r).reduce(function(s,i){return s+(Number(i.price)||0);},0);}

// ── API ──
function gasGet(p){return fetch(GAS+'?'+new URLSearchParams(p),{redirect:'follow'}).then(function(r){return r.json();});}
function gasPost(b){
  return fetch(GAS,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)})
    .then(function(r){return r.json();})
    .catch(function(e){return{error:e.message};});
}

// ── navigation ──
function go(name){
  document.querySelectorAll('.sc').forEach(function(s){s.classList.remove('on');});
  document.querySelectorAll('.nb').forEach(function(n){n.classList.remove('on');});
  document.getElementById('s-'+name).classList.add('on');
  var nb=document.getElementById('nav-'+name);
  if(nb)nb.classList.add('on');
  if(name==='cal')renderCal();
  else if(name==='sub')renderSub();
  else if(name==='cpn')renderCpn();
  else if(name==='settings')renderSettings();
  else if(name==='day')renderDay();
}

// ── toast ──
var _tt;
function toast(msg,type){
  type=type||'ok';
  var el=document.getElementById('toast');
  el.textContent=msg;el.className='toast show '+type;
  clearTimeout(_tt);_tt=setTimeout(function(){el.classList.remove('show');},2200);
}

// ── calendar ──
function shiftMon(d){curMon=new Date(curMon.getFullYear(),curMon.getMonth()+d,1);renderCal();}

function setCalMode(m){
  calMode=m;
  document.getElementById('tgl-a').classList.toggle('on',m==='amount');
  document.getElementById('tgl-c').classList.toggle('on',m==='coupon');
  renderCal();
}

function getSubDates(sub,y,m){
  var ms=y+'-'+pad(m+1);
  if(!sub.nextDate)return[];
  var base=new Date(sd(sub.nextDate)+'T00:00:00');
  if(isNaN(base.getTime()))return[];
  function step(d){if(sub.cycle==='monthly')d.setMonth(d.getMonth()+1);else d.setFullYear(d.getFullYear()+1);}
  function stepB(d){if(sub.cycle==='monthly')d.setMonth(d.getMonth()-1);else d.setFullYear(d.getFullYear()-1);}
  var res=[];
  var d=new Date(base);
  for(var i=0;i<60;i++){var ds=fmt(d);if(ds.startsWith(ms))res.push(ds);if(ds>ms+'-31')break;step(d);}
  d=new Date(base);stepB(d);
  for(var i=0;i<60;i++){var ds=fmt(d);if(ds.startsWith(ms))res.push(ds);if(ds<ms+'-01')break;stepB(d);}
  return res;
}

function renderCal(){
  var y=curMon.getFullYear(),m=curMon.getMonth();
  var ms=y+'-'+pad(m+1);
  document.getElementById('cal-mn').textContent=MN[m];
  document.getElementById('cal-yr').textContent=y;

  var dt={};
  records.forEach(function(r){
    var ds=sd(r.date);
    if(!ds.startsWith(ms))return;
    var day=ds.slice(8,10);
    dt[day]=(dt[day]||0)+rtot(r);
  });

  var cd={};
  coupons.forEach(function(c){
    var ds=sd(c.exp);
    if(ds.startsWith(ms))cd[ds.slice(8,10)]=1;
  });

  var rSum=Object.values(dt).reduce(function(s,v){return s+v;},0);
  var sSum=subs.reduce(function(s,sub){return s+getSubDates(sub,y,m).length*Number(sub.amount||0);},0);
  document.getElementById('cal-tot').innerHTML=(rSum+sSum).toLocaleString()+'<span>円</span>';

  var first=new Date(y,m,1).getDay();
  var days=new Date(y,m+1,0).getDate();
  var grid=document.getElementById('cal-grid');
  grid.innerHTML='';

  for(var i=0;i<first;i++){
    var c=document.createElement('div');c.className='cc emp';grid.appendChild(c);
  }
  for(var d=1;d<=days;d++){
    var day=pad(d);
    var dateStr=ms+'-'+day;
    var dow=new Date(y,m,d).getDay();
    var sa=subs.reduce(function(s,sub){return getSubDates(sub,y,m).indexOf(dateStr)>=0?s+Number(sub.amount||0):s;},0);
    var total=(dt[day]||0)+sa;
    var c=document.createElement('div');
    var cls=['cc'];
    if(dateStr===TODAY_STR)cls.push('today');
    if(dow===0)cls.push('sun');
    if(dow===6)cls.push('sat');
    c.className=cls.join(' ');
    (function(ds){c.onclick=function(){openDay(ds);};})(dateStr);
    var h='<div class="cday">'+d+'</div>';
    if(calMode==='amount'&&total>0)h+='<div class="camt">¥'+total.toLocaleString()+'</div>';
    if(calMode==='coupon'){
      if(cd[day])h+='<div class="cdot r"></div>';
      if(sa>0)h+='<div class="cdot g"></div>';
    }
    c.innerHTML=h;
    grid.appendChild(c);
  }
}

// ── day detail ──
function openDay(ds){
  curDate=ds;
  document.getElementById('day-title').textContent=jpDate(ds);
  go('day');
}

function renderDay(){
  var recs=records.filter(function(r){return sd(r.date)===curDate;});
  var parts=curDate.split('-').map(Number);
  var y=parts[0],m=parts[1];
  var dSubs=subs.filter(function(sub){return getSubDates(sub,y,m-1).indexOf(curDate)>=0;});
  var total=recs.reduce(function(s,r){return s+rtot(r);},0)+dSubs.reduce(function(s,sub){return s+Number(sub.amount||0);},0);

  document.getElementById('day-hd').innerHTML=
    '<div class="dh"><div class="dh-date">'+jpDate(curDate)+'</div><div class="dh-tot">'+total.toLocaleString()+'<span>円</span></div></div>';

  var h='';
  if(dSubs.length){
    h+='<div class="sl">サブスク</div>';
    dSubs.forEach(function(sub){
      h+='<div class="tc"><div class="tc-head"><div class="tc-shop">'+sub.name+'<span class="sub-bg" style="margin-left:6px">'+(sub.cycle==='monthly'?'月次':'年次')+'</span></div><div class="tc-tot">'+Number(sub.amount||0).toLocaleString()+'円</div></div>';
      if(sub.tags&&sub.tags.length)h+='<div class="tc-items"><div class="ti"><div class="ti-tgs">'+(sub.tags||[]).map(function(t){return'<span class="chip">'+t+'</span>';}).join('')+'</div></div></div>';
      h+='</div>';
    });
  }
  if(recs.length){
    h+='<div class="sl">買い物</div>';
    recs.forEach(function(r){
      var items=gitems(r);
      var rt=items.reduce(function(s,i){return s+(Number(i.price)||0);},0);
      var hasCpn=coupons.some(function(c){return c.shop===r.shop;});
      h+='<div class="tc"><div class="tc-head"><div class="tc-shop">'+r.shop+'</div><div class="tc-tot">'+rt.toLocaleString()+'円</div></div>';
      if(hasCpn)h+='<div class="c-alert">'+r.shop+'のクーポンあり</div>';
      h+='<div class="tc-items">'+items.map(function(it){return'<div class="ti"><div class="ti-p">'+Number(it.price||0).toLocaleString()+'円</div><div class="ti-tgs">'+(it.tags||[]).map(function(t){return'<span class="chip">'+t+'</span>';}).join('')+'</div></div>';}).join('')+'</div></div>';
    });
  }
  if(!h)h='<div class="empty"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>記録がありません</div>';
  h+='<div class="add-row" onclick="startShop()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>買い物を追加</div>';
  document.getElementById('day-body').innerHTML=h;
}

// ── shop form ──
function startShop(){
  curItems=[];
  document.getElementById('shop-nm').value='';
  upDl();
  renderItRows();
  go('shop');
}
function upDl(){
  document.getElementById('shop-dl').innerHTML=shops.map(function(s){return'<option value="'+s+'">';}).join('');
}
function renderItRows(){
  var el=document.getElementById('item-rows');
  if(!curItems.length){el.innerHTML='';return;}
  el.innerHTML=curItems.map(function(it,i){
    return'<div class="it-row"><div><div class="it-p">'+it.price.toLocaleString()+'円</div><div class="it-t">'+it.tags.join('・')+'</div></div><button class="it-del" onclick="delItem('+i+')">&#215;</button></div>';
  }).join('');
}
function delItem(i){curItems.splice(i,1);renderItRows();}

function goItem(){
  selIt=[];
  document.getElementById('item-pr').value='';
  document.getElementById('item-tgs').innerHTML=tags.map(function(t){
    return'<div class="tg" onclick="togIt(this,\''+t+'\')">'+t+'</div>';
  }).join('');
  go('item');
}
function togIt(el,t){
  el.classList.toggle('on');
  if(el.classList.contains('on'))selIt.push(t);else selIt=selIt.filter(function(x){return x!==t;});
}
function addItem(){
  var p=Number(document.getElementById('item-pr').value);
  if(!p||p<=0){toast('金額を入力してください','err');return;}
  curItems.push({price:p,tags:selIt.slice(),_id:nid++});
  renderItRows();
  go('shop');
}
function saveShop(){
  var shop=document.getElementById('shop-nm').value.trim();
  if(!shop){toast('店名を入力してください','err');return;}
  if(!curItems.length){toast('商品を追加してください','err');return;}
  var items=curItems.map(function(it){return{price:it.price,tags:it.tags};});
  gasPost({action:'addRecord',date:curDate,shop:shop,items:items}).then(function(r){
    if(r&&!r.error){
      records.push({date:curDate,shop:shop,items:items});
      curItems=[];
      toast('保存しました');
      go('day');
    }else toast('保存に失敗しました','err');
  });
}

// ── subs ──
function renderSub(){
  if(subs.length){
    var m=subs.reduce(function(s,sub){return s+(sub.cycle==='monthly'?Number(sub.amount||0):Math.round(Number(sub.amount||0)/12));},0);
    document.getElementById('sub-tot').innerHTML=m.toLocaleString()+'<span>円</span>';
    document.getElementById('sub-band').style.display='';
  }else document.getElementById('sub-band').style.display='none';
  var b=document.getElementById('sub-body');
  if(!subs.length){
    b.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>サブスクがありません</div>';
    return;
  }
  b.innerHTML=subs.map(function(sub,i){
    var nd=advNextDate(sub.nextDate,sub.cycle).replace(/-/g,'/');
    return'<div class="sub-c" onclick="openSubForm('+i+')"><div class="sub-hd"><div class="sub-nm">'+sub.name+'</div><div class="sub-am">'+Number(sub.amount||0).toLocaleString()+'円</div></div><div class="sub-mt"><span class="sub-bg">'+(sub.cycle==='monthly'?'月次':'年次')+'</span> 次回 '+nd+'<span>　</span>'+(sub.tags||[]).map(function(t){return'<span class="chip">'+t+'</span>';}).join('')+'</div></div>';
  }).join('');
}
function openSubForm(idx){
  sfIdx=idx;
  var sub=idx>=0?subs[idx]:null;
  document.getElementById('sf-title').textContent=idx<0?'サブスクを追加':'サブスクを編集';
  document.getElementById('sf-nm').value=sub&&sub.name||'';
  document.getElementById('sf-am').value=sub&&sub.amount||'';
  document.getElementById('sf-cy').value=sub&&sub.cycle||'monthly';
  document.getElementById('sf-nd').value=sub?sd(sub.nextDate):fmt(TODAY);
  sfTags=sub&&sub.tags?sub.tags.slice():[];
  renderSfTags();
  go('sub-form');
}
function renderSfTags(){
  document.getElementById('sf-tgs').innerHTML=tags.map(function(t){
    return'<div class="tg'+(sfTags.indexOf(t)>=0?' on':'')+'" onclick="togSf(this,\''+t+'\')">'+t+'</div>';
  }).join('');
  document.getElementById('sf-btns').innerHTML=
    (sfIdx>=0?'<button class="btn btn-d" onclick="delSub()">削除</button>':'')+
    '<button class="btn btn-g" onclick="go(\'sub\')">キャンセル</button>'+
    '<button class="btn btn-p" onclick="saveSub()">保存</button>';
}
function togSf(el,t){el.classList.toggle('on');if(el.classList.contains('on'))sfTags.push(t);else sfTags=sfTags.filter(function(x){return x!==t;});}
function saveSub(){
  var name=document.getElementById('sf-nm').value.trim();
  var amount=Number(document.getElementById('sf-am').value);
  var cycle=document.getElementById('sf-cy').value;
  var nextDate=document.getElementById('sf-nd').value;
  if(!name||!amount){toast('名前と金額を入力してください','err');return;}
  var data={name:name,amount:amount,cycle:cycle,nextDate:nextDate,tags:sfTags.slice()};
  if(sfIdx<0){
    gasPost(Object.assign({action:'addSub'},data)).then(function(r){
      if(r&&!r.error){subs.push(data);toast('追加しました');go('sub');}
      else toast('保存に失敗しました','err');
    });
  }else{
    gasPost(Object.assign({action:'updateSub',idx:sfIdx},data)).then(function(r){
      if(r&&!r.error){subs[sfIdx]=data;toast('更新しました');go('sub');}
      else toast('保存に失敗しました','err');
    });
  }
}
function delSub(){
  if(!confirm('削除しますか？'))return;
  gasPost({action:'deleteSub',idx:sfIdx}).then(function(r){
    if(r&&!r.error){subs.splice(sfIdx,1);toast('削除しました');go('sub');}
    else toast('削除に失敗しました','err');
  });
}

// ── coupons ──
function renderCpn(){
  var b=document.getElementById('cpn-body');
  if(!coupons.length){
    b.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="2"/><circle cx="12" cy="12" r="2"/></svg>クーポンがありません</div>';
    return;
  }
  b.innerHTML=coupons.map(function(c,i){
    var memo=c.memo?'<div class="cpn-memo">'+c.memo+'</div>':'';
    return'<div class="cpn-c" onclick="openCpnForm('+i+')"><div><div class="cpn-sh">'+c.shop+'</div><div class="cpn-ex">期限 '+sd(c.exp).replace(/-/g,'/')+'</div>'+memo+'</div><button class="use-btn" onclick="event.stopPropagation();useCpn('+i+')">使用</button></div>';
  }).join('');
}
function openCpnForm(idx){
  cfIdx=idx;
  var c=idx>=0?coupons[idx]:null;
  document.getElementById('cf-title').textContent=idx<0?'クーポンを追加':'クーポンを編集';
  document.getElementById('cf-sh').value=c&&c.shop||'';
  document.getElementById('cf-ex').value=c?sd(c.exp):fmt(TODAY);
  document.getElementById('cf-memo').value=c&&c.memo||'';
  document.getElementById('cf-btns').innerHTML=
    (idx>=0?'<button class="btn btn-d" onclick="delCpn()">削除</button>':'')+
    '<button class="btn btn-g" onclick="go(\'cpn\')">キャンセル</button>'+
    '<button class="btn btn-p" onclick="saveCoupon()">保存</button>';
  go('cpn-form');
}
function saveCoupon(){
  var shop=document.getElementById('cf-sh').value.trim();
  var exp=document.getElementById('cf-ex').value;
  var memo=document.getElementById('cf-memo').value.trim();
  if(!shop||!exp){toast('店名と期限を入力してください','err');return;}
  var data={shop:shop,exp:exp,memo:memo};
  if(cfIdx<0){
    gasPost(Object.assign({action:'addCoupon'},data)).then(function(r){
      if(r&&!r.error){coupons.push(data);toast('追加しました');go('cpn');}
      else toast('保存に失敗しました','err');
    });
  }else{
    gasPost(Object.assign({action:'updateCoupon',idx:cfIdx},data)).then(function(r){
      if(r&&!r.error){coupons[cfIdx]=data;toast('更新しました');go('cpn');}
      else toast('保存に失敗しました','err');
    });
  }
}
function delCpn(){
  if(!confirm('削除しますか？'))return;
  var c=coupons[cfIdx];
  gasPost({action:'deleteCoupon',id:c.id||cfIdx}).then(function(){
    coupons.splice(cfIdx,1);toast('削除しました');go('cpn');
  });
}
function useCpn(i){
  if(!confirm('使用済みにして削除しますか？'))return;
  var c=coupons[i];
  gasPost({action:'deleteCoupon',id:c.id||i}).then(function(){
    coupons.splice(i,1);toast('クーポンを使用しました');renderCpn();
  });
}

// ── settings ──
function renderSettings(){
  document.getElementById('st-tg').value=tags.join(',');
  document.getElementById('st-sh').value=shops.join(',');
}
function saveSettings(){
  tags=document.getElementById('st-tg').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
  shops=document.getElementById('st-sh').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
  gasPost({action:'updateTags',tags:tags});
  gasPost({action:'updateShops',shops:shops});
  upDl();
  toast('保存しました');
}

// ── init ──
go('cal');
function load(){
  var timeout=new Promise(function(_,r){setTimeout(function(){r(new Error('timeout'));},12000);});
  Promise.race([gasGet({action:'getAll'}),timeout]).then(function(data){
    if(data.records)records=data.records;
    if(data.coupons)coupons=data.coupons;
    if(data.tags&&data.tags.length)tags=data.tags;
    if(data.shops)shops=data.shops;
    if(data.subs)subs=data.subs;
    renderCal();
    upDl();
  }).catch(function(e){console.warn('load error',e);});
}
load();
</script>
